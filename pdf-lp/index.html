<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LP制作データ 動画入り</title>
  <meta name="description" content="LP制作データに既存LPの対談動画を差し込んだ確認用ページです。">
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #07090a;
    }

    body {
      display: flex;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .lp-stage {
      position: relative;
      width: min(100vw, 920px);
      aspect-ratio: 920 / 15105;
      background: url("lp-page.png") top center / 100% 100% no-repeat;
      box-shadow: 0 0 50px rgba(0, 0, 0, .45);
    }

    .video-slot,
    .cta-hotspot {
      position: absolute;
      display: block;
    }

    .video-slot {
      overflow: hidden;
      aspect-ratio: 16 / 9;
      border-radius: 2.4%;
      background: #050403;
      box-shadow: 0 0 0 1px rgba(212, 175, 122, .24);
    }

    .video-slot video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #050403;
    }

    .video-slot--one {
      left: 2.174%;
      top: 34.141%;
      width: 95.109%;
    }

    .video-slot--two {
      left: 5.870%;
      top: 46.018%;
      width: 87.717%;
    }

    .video-slot--three {
      left: 6.739%;
      top: 55.962%;
      width: 85.217%;
    }

    .cta-hotspot {
      border-radius: 999px;
      color: transparent;
      -webkit-tap-highlight-color: rgba(255, 255, 255, .18);
    }

    .cta-hotspot:focus-visible {
      outline: 3px solid rgba(255, 255, 255, .9);
      outline-offset: 3px;
    }

    .countdown-num {
      position: absolute;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 20%;
      height: .61%;
      top: 94.69%;
      background: linear-gradient(180deg, rgba(6, 7, 5, .98), rgba(7, 8, 6, .96));
      color: #d8b15d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: min(8.2vw, 74px);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 16px rgba(216, 177, 93, .28), 0 1px 0 rgba(255, 238, 182, .18);
      font-variant-numeric: tabular-nums;
    }

    .countdown-num--hours {
      left: 16.96%;
    }

    .countdown-num--minutes {
      left: 39.35%;
    }

    .countdown-num--seconds {
      left: 61.63%;
    }

    .cta-hotspot--one {
      left: 7.826%;
      top: 14.227%;
      width: 84.348%;
      height: .682%;
    }

    .cta-hotspot--two {
      left: 11.739%;
      top: 82.019%;
      width: 75.761%;
      height: .609%;
    }

    .cta-hotspot--three {
      left: 11.739%;
      top: 97.623%;
      width: 75.761%;
      height: .609%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="lp-stage" aria-label="LP制作データ 動画入り">
    <h1 class="sr-only">LP制作データ 動画入り</h1>

    <a class="cta-hotspot cta-hotspot--one" href="https://s.lmes.jp/landing-qr/1656900754-dgRyyZA2?uLand=lDiWQg" aria-label="LINEで詳細を受け取る"></a>

    <div class="video-slot video-slot--one">
      <video controls playsinline preload="metadata" poster="../student-result-270man-poster.jpg" src="../student-result-270man.mp4"></video>
    </div>

    <div class="video-slot video-slot--two">
      <video controls playsinline preload="metadata" poster="../student-result-marriage-poster.jpg" src="../student-result-marriage.mp4"></video>
    </div>

    <div class="video-slot video-slot--three">
      <video controls playsinline preload="metadata" poster="../student-result-clean-confidence-poster.jpg" src="../student-result-clean-confidence.mp4"></video>
    </div>

    <span class="countdown-num countdown-num--hours" data-countdown-hours aria-hidden="true">00</span>
    <span class="countdown-num countdown-num--minutes" data-countdown-minutes aria-hidden="true">00</span>
    <span class="countdown-num countdown-num--seconds" data-countdown-seconds aria-hidden="true">00</span>

    <a class="cta-hotspot cta-hotspot--two" href="https://s.lmes.jp/landing-qr/1656900754-dgRyyZA2?uLand=lDiWQg" aria-label="LINEで詳細を受け取る"></a>
    <a class="cta-hotspot cta-hotspot--three" href="https://s.lmes.jp/landing-qr/1656900754-dgRyyZA2?uLand=lDiWQg" aria-label="LINEで詳細を受け取る"></a>
  </main>
  <script>
    (function () {
      var key = "pdf_lp_countdown_target_v1";
      var duration = 60 * 60 * 1000;
      var hours = document.querySelector("[data-countdown-hours]");
      var minutes = document.querySelector("[data-countdown-minutes]");
      var seconds = document.querySelector("[data-countdown-seconds]");

      function pad(value) {
        return String(value).padStart(2, "0");
      }

      function getTarget() {
        var target = Number(localStorage.getItem(key) || 0);
        var now = Date.now();
        if (!target || target <= now) {
          target = now + duration;
          localStorage.setItem(key, String(target));
        }
        return target;
      }

      var target = getTarget();

      function render() {
        var remaining = target - Date.now();
        if (remaining <= 0) {
          localStorage.removeItem(key);
          target = getTarget();
          remaining = target - Date.now();
        }

        var h = Math.floor(remaining / 3600000);
        remaining -= h * 3600000;
        var m = Math.floor(remaining / 60000);
        remaining -= m * 60000;
        var s = Math.floor(remaining / 1000);

        hours.textContent = pad(h);
        minutes.textContent = pad(m);
        seconds.textContent = pad(s);
      }

      render();
      setInterval(render, 1000);
    })();
  </script>
</body>
</html>
